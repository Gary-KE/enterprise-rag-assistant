name: Fetch a source document

# Downloads one public document from an https URL and puts it on a separate review branch
# (fetched-sources/<name>), so it can be checked by hand before it is committed to data/corpus/ and
# pinned in data/corpus.lock.json. Started by hand only. Nothing is changed on main.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "https URL of the document"
        required: true
      name:
        description: "File name to save it as (letters, digits, dot, dash, underscore)"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and describe
        env:
          URL: ${{ github.event.inputs.url }}
          NAME: ${{ github.event.inputs.name }}
        run: |
          set -euo pipefail
          case "$URL" in https://*) ;; *) echo "::error::only https URLs"; exit 1 ;; esac
          if ! printf '%s' "$NAME" | grep -Eq '^[A-Za-z0-9._-]{1,80}$'; then echo "::error::bad file name"; exit 1; fi
          mkdir -p out
          curl -fsSL --max-time 120 --max-filesize 52428800 -A "Mozilla/5.0 (enterprise-rag-assistant source fetch)" \
            -o "out/$NAME" "$URL"
          file "out/$NAME"
          sha256sum "out/$NAME" | tee out/SHA256SUMS
          ls -l out
      - name: Put it on a review branch
        env:
          NAME: ${{ github.event.inputs.name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b "fetched-sources/$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fetched source for review: $NAME"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/fetched-sources/$NAME"
