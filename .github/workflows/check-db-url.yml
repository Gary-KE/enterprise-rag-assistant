name: Check the DATABASE_URL secret

# Run by hand. Prints the shape of the DATABASE_URL secret (user name, host, port, database, and only
# the length and character kinds of the password) so a bad connection string can be fixed.
# It never prints the password, and it makes one test connection.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - name: Describe the URL and try it
        run: |
          python - <<'PY'
          import os, re, sys
          from urllib.parse import unquote
          raw = os.environ.get("DATABASE_URL", "")
          print("secret present:", bool(raw), "| length:", len(raw))
          print("has leading/trailing whitespace or newline:", raw != raw.strip() or "\n" in raw)
          print("contains [ or ] or YOUR-PASSWORD:", "[" in raw or "]" in raw or "YOUR-PASSWORD" in raw.upper())
          body = raw.strip()
          scheme, _, rest = body.partition("://")
          creds, _, hostpart = rest.rpartition("@")
          user, _, pw = creds.partition(":")
          host, _, tail = hostpart.partition("/")
          print("scheme:", scheme)
          print("user:", user)
          print("host:", host, "| database:", tail)
          print("password length:", len(unquote(pw)))
          print("password kinds: letters=%s digits=%s other=%s" % (
              bool(re.search("[A-Za-z]", pw)), bool(re.search("[0-9]", pw)), bool(re.search("[^A-Za-z0-9]", pw))))
          print("password starts with [ :", pw.startswith("["), "| ends with ] :", pw.endswith("]"))
          print("password is the placeholder text:", "YOUR-PASSWORD" in pw.upper())
          print("brackets elsewhere in the string (user/host):", any(c in user + host + tail for c in "[]"))
          print("characters in the password that need percent-encoding:", sorted(set(re.findall(r"[@/:?#\[\]]", pw))))
          import psycopg
          try:
              with psycopg.connect(raw.strip(), connect_timeout=15) as c:
                  print("CONNECTED:", c.execute("select current_user").fetchone()[0])
          except Exception as e:
              print("CONNECT FAILED:", str(e).splitlines()[0])
              sys.exit(1)
          PY
