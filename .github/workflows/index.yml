name: Load the corpus into Supabase

# Run by hand (Actions tab > this workflow > Run workflow) after adding the secrets
# DATABASE_URL and GEMINI_API_KEY. Safe to rerun: stored documents are skipped.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDERS: http
      RAG_LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      RAG_LLM_MODEL: ${{ vars.RAG_LLM_MODEL || 'gemini-flash-latest' }}
      RAG_EMBED_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      RAG_EMBED_MODEL: ${{ vars.RAG_EMBED_MODEL || 'gemini-embedding-2' }}
      RAG_EMBED_DIM: ${{ vars.RAG_EMBED_DIM || '768' }}
      RAG_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_EMBED_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres]"
      - run: python scripts/fetch_corpus.py
      - run: python scripts/build_index.py --target pgvector
