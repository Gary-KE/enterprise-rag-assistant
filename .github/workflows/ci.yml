name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ragas]"
      - name: Unit, API, security and evaluation tests
        run: pytest -q

  offline-eval:
    # Real corpus, stand-in models: checks the golden set against the real Act and that retrieval,
    # citation checks and declining hold up, without spending any API quota.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Download the corpus
        run: python scripts/fetch_corpus.py
      - name: Verify every golden quote exists in the downloaded documents
        run: python scripts/verify_golden.py
      - name: Offline evaluation and quality gate
        run: python scripts/run_eval.py --mode offline
      - name: Publish the report
        if: always()
        run: |
          if [ -f eval/results/offline/report.md ]; then cat eval/results/offline/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval
          path: |
            eval/results/offline
            data/corpus.lock.json
